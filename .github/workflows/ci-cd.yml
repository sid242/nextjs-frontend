name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: app-web
  ECS_CLUSTER: app-prod
  ECS_SERVICE: app-web

jobs:
  docker-build-check:
    name: Verify Dockerfile build on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (dry-run without push)
        run: docker build -t app-web:pr-check .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Security audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Verify ECS task definition env and secrets
        run: |
          node -e '
            const td = require("./deploy/task-def-web.json");
            const container = td.containerDefinitions[0];
            const envNames = new Set((container.environment || []).map(e => e.name));
            const secretNames = new Set((container.secrets || []).map(s => s.name));
            const requiredEnv = ["API_URL", "SOCKET_URL", "NEXT_PUBLIC_APP_BASE_DOMAIN", "PLATFORM_HOST"];
            const requiredSecrets = ["BFF_SHARED_SECRET"];
            for (const name of requiredEnv) {
              if (!envNames.has(name)) throw new Error("Missing env: " + name);
            }
            for (const name of requiredSecrets) {
              if (!secretNames.has(name)) throw new Error("Missing secret: " + name);
            }
            console.log("ECS task definition env and secrets verified successfully.");
          '

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: |
          if [ -n "$FOUNDATION_WEB_URL" ]; then
            npm run test:e2e
          else
            echo "Skipping live E2E against remote cluster (FOUNDATION_WEB_URL not set)"
          fi
        env:
          FOUNDATION_WEB_URL: ${{ secrets.FOUNDATION_WEB_URL }}
          FOUNDATION_STAFF_EMAIL: ${{ secrets.FOUNDATION_STAFF_EMAIL }}
          FOUNDATION_FIXTURE_PASSWORD: ${{ secrets.FOUNDATION_FIXTURE_PASSWORD }}

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e3dd14a369e91ce0b5efd6e0196ac721811e77b6 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff07dd23da81bc5e88612d6a5063 # v2.0.1

      - name: Build & push image
        id: image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - id: td
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfcac51b702982d6418247674ee572c84268 # v1.2.0
        with:
          task-definition: deploy/task-def-web.json
          container-name: web
          image: ${{ steps.image.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@df4a08a49c370d50426fe35c6280771a48075323 # v2.1.2
        with:
          task-definition: ${{ steps.td.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true # rolling deploy; ECS rolls back if health checks fail

      - name: Post-deploy smoke test
        run: |
          if [ -n "$PROD_WEB_BASE_URL" ]; then
            echo "Verifying web frontend probe..."
            curl -f --retry 5 --retry-delay 5 --max-time 10 "$PROD_WEB_BASE_URL"
            curl -f --retry 3 --retry-delay 5 --max-time 10 "$PROD_WEB_BASE_URL/api/health"
            echo "Frontend smoke test passed successfully."
          else
            echo "PROD_WEB_BASE_URL not set; skipping remote smoke test."
          fi
        env:
          PROD_WEB_BASE_URL: ${{ vars.PROD_WEB_BASE_URL }}
